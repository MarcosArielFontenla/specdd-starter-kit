name: CI

on:
  push:
    branches: [main]
    paths: ['specdd-kit/**', '.github/workflows/ci.yml']
  pull_request:
    branches: [main]
    paths: ['specdd-kit/**', '.github/workflows/ci.yml']

jobs:
  specdd-kit-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: specdd-kit/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run bundle-kit
      - run: npm run test:unit
      - run: npm run build
