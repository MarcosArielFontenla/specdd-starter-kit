<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Logo lockups" subtitle="Wordmark + ice-crystal mark, dark & light" viewport="700x150" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-body);display:flex;}
  .panel{flex:1;display:flex;align-items:center;gap:14px;padding:26px;}
  .dark{background:var(--ink-950);}
  .light{background:var(--grad-frost);}
  .word{font-family:var(--font-display);font-weight:800;font-size:30px;letter-spacing:1px;}
  .dark .word{color:var(--frost-50);}
  .light .word{color:var(--ink-900);}
  .mark{width:46px;height:46px;flex:none;}
  .tag{font-family:var(--font-mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;margin-top:5px;}
  .dark .tag{color:var(--glacier-300);}
  .light .tag{color:var(--glacier-600);}
</style></head>
<body>
  <div class="panel dark">
    <img class="mark" src="../assets/logo-boreal-mark.svg" alt="mark">
    <div><div class="word">BOREAL</div><div class="tag">Winter Expeditions</div></div>
  </div>
  <div class="panel light">
    <img class="mark" src="../assets/logo-boreal-mark.svg" alt="mark">
    <div><div class="word">BOREAL</div><div class="tag">Winter Expeditions</div></div>
  </div>
</body></html>
