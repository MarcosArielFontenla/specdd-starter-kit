<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">

<style>

<body>
  <div class="eye">TEMPORADA · DIC–MAR</div>

    <div class="d"><div class="n">−24<b>°C</b></div><div class="k">temp. media</div></div>
    <div class="d"><div class="n">53.5<b>°N</b></div><div class="k">latitud</div></div>
    <div class="d"><div class="n">1642<b>m</b></div><div class="k">profundidad</div></div>
    <div class="d"><div class="n">6 <b>días</b></div><div class="k">duración</div></div>

  <div class="sub">SPACE MONO · tabular-nums · eyebrows, labels &amp; expedition data</div>
