<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Ink / Night scale" subtitle="Blue-tinted near-blacks — page & dark surfaces" viewport="700x150" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--ink-950);font-family:var(--font-body);padding:22px;}
  .row{display:flex;gap:10px;}
  .sw{flex:1;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-soft);}
  .chip{height:74px;}
  .meta{padding:8px 10px;background:rgba(255,255,255,0.02);}
  .name{font-family:var(--font-mono);font-size:11px;color:var(--fg1);letter-spacing:.02em;}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--fg3);margin-top:2px;}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--ink-950)"></div><div class="meta"><div class="name">ink-950</div><div class="hex">#060D16</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-900)"></div><div class="meta"><div class="name">ink-900</div><div class="hex">#0A1420</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-850)"></div><div class="meta"><div class="name">ink-850</div><div class="hex">#0E1B2A</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-800)"></div><div class="meta"><div class="name">ink-800</div><div class="hex">#122335</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-700)"></div><div class="meta"><div class="name">ink-700</div><div class="hex">#1A3047</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-600)"></div><div class="meta"><div class="name">ink-600</div><div class="hex">#244660</div></div></div>
  </div>
</body></html>
