<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Ice / Frost lights" subtitle="Ice, frost & snow — text and light panels" viewport="700x150" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--ink-950);font-family:var(--font-body);padding:22px;}
  .row{display:flex;gap:10px;}
  .sw{flex:1;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-soft);}
  .chip{height:74px;}
  .meta{padding:8px 10px;background:rgba(255,255,255,0.02);}
  .name{font-family:var(--font-mono);font-size:11px;color:var(--fg1);}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--fg3);margin-top:2px;}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--ice-300)"></div><div class="meta"><div class="name">ice-300</div><div class="hex">#A9CFE4</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ice-200)"></div><div class="meta"><div class="name">ice-200</div><div class="hex">#C8E0ED</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--frost-100)"></div><div class="meta"><div class="name">frost-100</div><div class="hex">#E6F1F7</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--frost-50)"></div><div class="meta"><div class="name">frost-50</div><div class="hex">#F3F9FC</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--snow);border-bottom:1px solid var(--border-soft)"></div><div class="meta"><div class="name">snow</div><div class="hex">#FFFFFF</div></div></div>
  </div>
</body></html>
