<!DOCTYPE html>
<!-- @dsCard group="Components" name="Tour cards" subtitle="Glass card — featured + default" viewport="700x290" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--ink-950);font-family:var(--font-body);padding:22px;display:flex;gap:16px;}
  .card{width:300px;background:var(--surface-glass);backdrop-filter:blur(var(--blur-glass));border:1px solid var(--border-glass);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-lg);}
  .card.feat{box-shadow:var(--shadow-lg),var(--shadow-frost);}
  .photo{height:120px;background:var(--grad-glacier);position:relative;}
  .photo::after{content:"";position:absolute;inset:0;background:var(--grad-aurora);opacity:.6;}
  .photo .badge{position:absolute;top:12px;left:12px;font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;color:#fff;background:rgba(6,13,22,.5);border:1px solid var(--border-glass);padding:4px 9px;border-radius:999px;z-index:2;}
  .body{padding:16px;}
  .eye{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--glacier-300);}
  .h{font-family:var(--font-display);font-weight:700;font-size:21px;color:var(--fg1);margin:7px 0 10px;letter-spacing:-.01em;}
  .meta{display:flex;gap:14px;font-family:var(--font-mono);font-size:11px;color:var(--fg3);margin-bottom:14px;}
  .foot{display:flex;align-items:center;justify-content:space-between;}
  .price{font-family:var(--font-display);font-weight:700;font-size:22px;color:var(--fg1);}
  .price b{color:var(--ember-500);}
  .cta{font-family:var(--font-body);font-weight:600;font-size:13px;color:var(--fg-on-accent);background:var(--ember-500);border:0;border-radius:999px;padding:9px 16px;cursor:pointer;}
  svg{width:14px;height:14px;vertical-align:-2px;}
</style></head>
<body>
  <div class="card feat">
    <div class="photo"><span class="badge">EXPEDICIÓN 01</span></div>
    <div class="body">
      <div class="eye">RUTA BAIKAL</div>
      <div class="h">Travesía sobre hielo</div>
      <div class="meta"><span><i data-lucide="calendar"></i> 6 días</span><span><i data-lucide="thermometer-snowflake"></i> −24°C</span><span><i data-lucide="mountain-snow"></i> 3/5</span></div>
      <div class="foot"><div class="price"><b>€</b>1.840</div><button class="cta">Reservar</button></div>
    </div>
  </div>
  <div class="card">
    <div class="photo" style="background:var(--grad-night)"><span class="badge">EXPEDICIÓN 02</span></div>
    <div class="body">
      <div class="eye">CUEVAS DE HIELO</div>
      <div class="h">Bajo el lago</div>
      <div class="meta"><span><i data-lucide="calendar"></i> 4 días</span><span><i data-lucide="thermometer-snowflake"></i> −18°C</span><span><i data-lucide="mountain-snow"></i> 2/5</span></div>
      <div class="foot"><div class="price"><b>€</b>1.120</div><button class="cta">Reservar</button></div>
    </div>
  </div>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
</body></html>
