<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Brand gradients" subtitle="Glacier, aurora glow, ember & frost" viewport="700x165" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--ink-950);font-family:var(--font-body);padding:22px;}
  .row{display:flex;gap:12px;}
  .g{flex:1;height:120px;border-radius:var(--radius-md);border:1px solid var(--border-soft);position:relative;overflow:hidden;}
  .lab{position:absolute;left:10px;bottom:9px;font-family:var(--font-mono);font-size:10px;color:#fff;letter-spacing:.04em;text-shadow:0 1px 4px rgba(0,0,0,.6);}
</style></head>
<body>
  <div class="row">
    <div class="g" style="background:var(--grad-glacier)"><span class="lab">--grad-glacier</span></div>
    <div class="g" style="background:var(--grad-aurora),var(--ink-950)"><span class="lab">--grad-aurora</span></div>
    <div class="g" style="background:var(--grad-ember)"><span class="lab">--grad-ember</span></div>
    <div class="g" style="background:var(--grad-frost)"><span class="lab" style="color:#0e1b2a;text-shadow:none">--grad-frost</span></div>
  </div>
</body></html>
