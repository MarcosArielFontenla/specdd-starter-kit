<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Frosted glass surfaces" subtitle="Signature blur surface — dark & ice variants" viewport="700x220" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-body);padding:0;}
  .stage{background:var(--grad-glacier);padding:30px 24px;position:relative;min-height:160px;display:flex;gap:16px;align-items:center;}
  .stage::before{content:"";position:absolute;inset:0;background:var(--grad-aurora);opacity:.7;}
  .glass{position:relative;flex:1;background:var(--surface-glass);backdrop-filter:blur(var(--blur-glass));-webkit-backdrop-filter:blur(var(--blur-glass));border:1px solid var(--border-glass);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg),var(--shadow-inset-hair);padding:18px;}
  .eye{font-family:var(--font-mono);font-size:10px;letter-spacing:.18em;color:var(--ice-200);text-transform:uppercase;}
  .h{font-family:var(--font-display);font-weight:700;font-size:20px;color:#fff;margin:8px 0 4px;letter-spacing:-.01em;}
  .p{font-size:13px;color:rgba(255,255,255,.78);line-height:1.5;margin:0;}
  .light{background:rgba(243,249,252,.9);}
  .light .eye{color:var(--glacier-600)}.light .h{color:var(--ink-900)}.light .p{color:var(--fg2-light)}
</style></head>
<body>
  <div class="stage">
    <div class="glass">
      <div class="eye">FROSTED GLASS</div>
      <div class="h">surface-glass + blur</div>
      <p class="p">backdrop-filter blur 18px · border-glass hairline · inset highlight.</p>
    </div>
    <div class="glass light">
      <div class="eye">ICE PANEL</div>
      <div class="h">light frost variant</div>
      <p class="p">For bright sections over photography.</p>
    </div>
  </div>
</body></html>
