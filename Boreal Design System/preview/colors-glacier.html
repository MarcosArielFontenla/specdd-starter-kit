<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Glacier blue scale" subtitle="Core brand blue — glacier-500 primary" viewport="700x150" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--ink-950);font-family:var(--font-body);padding:22px;}
  .row{display:flex;gap:10px;}
  .sw{flex:1;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-soft);}
  .chip{height:74px;position:relative;}
  .tag{position:absolute;top:8px;left:8px;font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;color:#06121c;background:rgba(255,255,255,.7);padding:2px 6px;border-radius:999px;}
  .meta{padding:8px 10px;background:rgba(255,255,255,0.02);}
  .name{font-family:var(--font-mono);font-size:11px;color:var(--fg1);}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--fg3);margin-top:2px;}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--glacier-700)"></div><div class="meta"><div class="name">glacier-700</div><div class="hex">#1F4E70</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--glacier-600)"></div><div class="meta"><div class="name">glacier-600</div><div class="hex">#2C6791</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--glacier-500)"><span class="tag">PRIMARY</span></div><div class="meta"><div class="name">glacier-500</div><div class="hex">#3C82B4</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--glacier-400)"></div><div class="meta"><div class="name">glacier-400</div><div class="hex">#5BA0CE</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--glacier-300)"></div><div class="meta"><div class="name">glacier-300</div><div class="hex">#86BEDF</div></div></div>
  </div>
</body></html>
