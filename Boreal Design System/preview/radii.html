<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Corner radii" subtitle="xs 6 → xl 32 + pill" viewport="700x150" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--ink-950);font-family:var(--font-body);padding:24px;display:flex;gap:16px;align-items:flex-end;}
  .b{background:var(--surface-glass-light);border:1px solid var(--border-glass);width:84px;height:64px;}
  .t{font-family:var(--font-mono);font-size:10px;color:var(--fg3);text-align:center;margin-top:8px;}
  .c{display:flex;flex-direction:column;align-items:center;}
</style></head>
<body>
  <div class="c"><div class="b" style="border-radius:var(--radius-xs)"></div><div class="t">xs · 6</div></div>
  <div class="c"><div class="b" style="border-radius:var(--radius-sm)"></div><div class="t">sm · 10</div></div>
  <div class="c"><div class="b" style="border-radius:var(--radius-md)"></div><div class="t">md · 16</div></div>
  <div class="c"><div class="b" style="border-radius:var(--radius-lg)"></div><div class="t">lg · 22</div></div>
  <div class="c"><div class="b" style="border-radius:var(--radius-xl)"></div><div class="t">xl · 32</div></div>
  <div class="c"><div class="b" style="border-radius:var(--radius-pill);width:84px"></div><div class="t">pill</div></div>
</body></html>
