<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Cool slate neutrals" subtitle="Blue-tinted gray ramp 50→900" viewport="700x150" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--ink-950);font-family:var(--font-body);padding:22px;}
  .row{display:flex;gap:6px;}
  .sw{flex:1;}
  .chip{height:56px;border-radius:6px;border:1px solid var(--border-soft);}
  .name{font-family:var(--font-mono);font-size:9.5px;color:var(--fg3);margin-top:6px;text-align:center;}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--slate-900)"></div><div class="name">900</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-800)"></div><div class="name">800</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-700)"></div><div class="name">700</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-600)"></div><div class="name">600</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-500)"></div><div class="name">500</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-400)"></div><div class="name">400</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-300)"></div><div class="name">300</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-200)"></div><div class="name">200</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-100)"></div><div class="name">100</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-50)"></div><div class="name">50</div></div>
  </div>
  <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-muted);margin-top:14px;letter-spacing:.04em;">COOL SLATE · blue-tinted neutrals (--slate-50 → --slate-900)</div>
</body></html>
