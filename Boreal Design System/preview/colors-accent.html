<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Ember & Aurora accents" subtitle="Warm ember CTA accent + aurora success mint" viewport="700x150" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--ink-950);font-family:var(--font-body);padding:22px;}
  .row{display:flex;gap:10px;}
  .sw{flex:1;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-soft);}
  .chip{height:74px;position:relative;}
  .tag{position:absolute;top:8px;left:8px;font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;color:#1a0e06;background:rgba(255,255,255,.78);padding:2px 6px;border-radius:999px;}
  .meta{padding:8px 10px;background:rgba(255,255,255,0.02);}
  .name{font-family:var(--font-mono);font-size:11px;color:var(--fg1);}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--fg3);margin-top:2px;}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--ember-600)"></div><div class="meta"><div class="name">ember-600</div><div class="hex">#D2723A</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ember-500)"><span class="tag">ACCENT</span></div><div class="meta"><div class="name">ember-500</div><div class="hex">#E8884C</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ember-400)"></div><div class="meta"><div class="name">ember-400</div><div class="hex">#F2A062</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--aurora-500)"><span class="tag">SUCCESS</span></div><div class="meta"><div class="name">aurora-500</div><div class="hex">#45C49E</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--aurora-400)"></div><div class="meta"><div class="name">aurora-400</div><div class="hex">#63D6B2</div></div></div>
  </div>
</body></html>
