<!DOCTYPE html>
<!-- @dsCard group="Components" name="Form inputs" subtitle="Glass fields with focus ring" viewport="700x150" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--ink-900);font-family:var(--font-body);padding:24px;display:flex;gap:14px;flex-wrap:wrap;}
  .field{flex:1;min-width:180px;}
  .lab{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);margin-bottom:7px;display:block;}
  .inp{width:100%;box-sizing:border-box;background:var(--surface-glass-light);border:1px solid var(--border-glass);border-radius:var(--radius-md);padding:13px 14px;color:var(--fg1);font-family:var(--font-body);font-size:15px;}
  .inp::placeholder{color:var(--fg-muted);}
  .inp.focus{border-color:var(--glacier-500);box-shadow:0 0 0 3px rgba(60,130,180,.25);outline:none;}
  .row{display:flex;align-items:center;gap:9px;background:var(--surface-glass-light);border:1px solid var(--border-glass);border-radius:var(--radius-md);padding:13px 14px;color:var(--fg2);font-size:15px;}
  svg{width:17px;height:17px;color:var(--glacier-300);}
</style></head>
<body>
  <div class="field"><label class="lab">Salida</label><div class="row"><i data-lucide="calendar"></i> 12 — 18 enero</div></div>
  <div class="field"><label class="lab">Email</label><input class="inp focus" value="tu@correo.com"></div>
  <div class="field"><label class="lab">Viajeros</label><input class="inp" placeholder="2 personas"></div>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
</body></html>
