<!DOCTYPE html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Primary (ember), glass secondary, ghost" viewport="700x135" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--ink-900);font-family:var(--font-body);padding:26px 24px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;}
  .btn{font-family:var(--font-body);font-weight:600;font-size:15px;border-radius:var(--radius-pill);padding:13px 24px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:8px;letter-spacing:.01em;}
  .primary{background:var(--ember-500);color:var(--fg-on-accent);box-shadow:var(--shadow-ember);}
  .primary.hover{background:var(--ember-400);}
  .secondary{background:var(--surface-glass-light);color:var(--fg1);border-color:var(--border-glass);backdrop-filter:blur(10px);}
  .secondary.hover{border-color:var(--glacier-400);color:#fff;}
  .ghost{background:transparent;color:var(--glacier-300);}
  .ghost.hover{color:var(--ice-200);}
  .small{font-size:13px;padding:9px 16px;}
  .lab{position:absolute;font-family:var(--font-mono);font-size:9px;color:var(--fg-muted);margin-top:46px;}
  .wrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .t{font-family:var(--font-mono);font-size:9px;color:var(--fg-muted);}
  svg{width:17px;height:17px;}
</style></head>
<body>
  <div class="wrap"><button class="btn primary">Reservar expedición</button><span class="t">primary / default</span></div>
  <div class="wrap"><button class="btn primary hover">Reservar expedición</button><span class="t">primary / hover</span></div>
  <div class="wrap"><button class="btn secondary">Ver rutas</button><span class="t">secondary (glass)</span></div>
  <div class="wrap"><button class="btn ghost">Descargar itinerario →</button><span class="t">ghost</span></div>
  <div class="wrap"><button class="btn primary small"><i data-lucide="snowflake"></i> Pequeño</button><span class="t">small + icon</span></div>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
</body></html>
