<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="4px base · space-1 → space-10" viewport="700x250" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>

  .bar{height:14px;background:var(--grad-glacier);border-radius:3px;}
  .tok{font-family:var(--font-mono);font-size:10px;color:var(--fg3);width:74px;flex:none;}
  .px{font-family:var(--font-mono);font-size:10px;color:var(--fg-muted);}
</style></head>
<body>
  <div class="r"><span class="tok">space-1</span><div class="bar" style="width:4px"></div><span class="px">4</span></div>

</body></html>
