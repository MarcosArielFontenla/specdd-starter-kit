<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Elevation & glows" subtitle="Cool shadows + frost & ember glow" viewport="700x175" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--ink-900);font-family:var(--font-body);padding:30px 22px;display:flex;gap:20px;flex-wrap:wrap;}
  .b{width:120px;height:78px;background:var(--ink-800);border:1px solid var(--border-soft);border-radius:var(--radius-md);}
  .t{font-family:var(--font-mono);font-size:10px;color:var(--fg3);text-align:center;margin-top:12px;}
  .c{display:flex;flex-direction:column;align-items:center;}
</style></head>
<body>
  <div class="c"><div class="b" style="box-shadow:var(--shadow-md)"></div><div class="t">shadow-md</div></div>
  <div class="c"><div class="b" style="box-shadow:var(--shadow-lg)"></div><div class="t">shadow-lg</div></div>
  <div class="c"><div class="b" style="box-shadow:var(--shadow-xl)"></div><div class="t">shadow-xl</div></div>
  <div class="c"><div class="b" style="box-shadow:var(--shadow-frost);border-color:var(--border-glass)"></div><div class="t">frost glow</div></div>
  <div class="c"><div class="b" style="box-shadow:var(--shadow-ember);border-color:rgba(232,136,76,.4)"></div><div class="t">ember glow</div></div>
</body></html>
